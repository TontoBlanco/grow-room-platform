{{- if or .Values.alerts.staleShipper.enabled .Values.alerts.vpdOutOfBand.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: grow-alerts-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grow-alerts.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  selector:
    app.kubernetes.io/name: grow-alerts
    app.kubernetes.io/component: credentials
  ports:
    - name: http
      port: {{ .Values.identity.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grow-alerts-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grow-alerts.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grow-alerts
      app.kubernetes.io/component: credentials
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grow-alerts
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: credentials
    spec:
      automountServiceAccountToken: false
      # The signing helper is the Amazon Linux build. It runs in this image,
      # not in the Debian cron image. The key is mounted here and is not in git.
      initContainers:
        - name: fetch-aws-signing-helper
          image: "{{ .Values.credentialsImage.repository }}:{{ .Values.credentialsImage.tag }}"
          imagePullPolicy: {{ .Values.credentialsImage.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              case "$(uname -m)" in
                x86_64)
                  sha={{ .Values.signingHelper.sha256.x86_64 | quote }}
                  arch=X86_64
                  ;;
                aarch64|arm64)
                  sha={{ .Values.signingHelper.sha256.aarch64 | quote }}
                  arch=Aarch64
                  ;;
                *)
                  echo "unsupported architecture: $(uname -m)" >&2
                  exit 1
                  ;;
              esac
              curl -fsSL -o /opt/rolesanywhere/aws_signing_helper \
                "{{ .Values.signingHelper.urlBase }}/${arch}/Linux/Amzn2023/aws_signing_helper"
              echo "${sha}  /opt/rolesanywhere/aws_signing_helper" | sha256sum -c -
              chmod 0755 /opt/rolesanywhere/aws_signing_helper
          volumeMounts:
            - name: aws-signing-helper
              mountPath: /opt/rolesanywhere
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: credentials
          image: "{{ .Values.credentialsImage.repository }}:{{ .Values.credentialsImage.tag }}"
          imagePullPolicy: {{ .Values.credentialsImage.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              python3 -c 'import base64,pathlib; pathlib.Path("/tmp/grow_alerts.py").write_bytes(base64.b64decode(pathlib.Path("/scripts/grow_alerts.py.b64").read_text(encoding="utf-8").strip()))'
              exec python3 /tmp/grow_alerts.py credentials --port {{ .Values.identity.port }}
          env:
            - name: HOME
              value: /tmp
            - name: AWS_REGION
              value: {{ .Values.identity.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.identity.region | quote }}
            - name: GROW_ALERTS_IDENTITY_DIR
              value: /etc/grow-alerts/identity
            - name: AWS_SIGNING_HELPER
              value: /opt/rolesanywhere/aws_signing_helper
          ports:
            - name: http
              containerPort: {{ .Values.identity.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: identity
              mountPath: /etc/grow-alerts/identity
              readOnly: true
            - name: aws-signing-helper
              mountPath: /opt/rolesanywhere
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: grow-alerts-script
        - name: aws-signing-helper
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: identity
          secret:
            secretName: {{ .Values.identity.secretName }}
            optional: false
            defaultMode: 0440
{{- end }}
