{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.audit.databaseUrlSecret | default "audit-db" }}
  labels:
    {{- include "sensor-service.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ .Values.audit.databaseUrlSecret | default "audit-db" }}
    template:
      engineVersion: v2
      data:
        url: {{ printf "postgresql://{{ .username }}:{{ .password | urlquery }}@%s:5432/%s?sslmode=require" .Values.externalSecret.dbHost .Values.externalSecret.dbName | quote }}
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteKey }}
{{- end }}