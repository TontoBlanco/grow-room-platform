# charts/sensor-service/values-eks.yaml - fill from: terraform output
replicaCount: 3

# Tent-wide stage for the aws-poc Argo app. veg is 0.8-1.2 kPa leaf VPD.
env:
  GROW_STAGE: veg

audit:
  databaseUrlSecret: audit-db

externalSecret:
  enabled: true
  remoteKey: "set-by-scripts/aws-poc.ps1"   # rds_secret_arn
  dbHost: "set-by-scripts/aws-poc.ps1"      # rds_address

ingress:
  enabled: true
  className: alb
  host: app.mygrowroom.click   # terraform output app_fqdn; ExternalDNS publishes it
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: grow-room-poc
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/tags: Project=grow-room,Environment=poc
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "set-by-scripts/aws-poc.ps1"   # certificate_arn
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/wafv2-acl-arn: "set-by-scripts/aws-poc.ps1"   # waf_arn

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sensor-service