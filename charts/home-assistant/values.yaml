# Applied only by scripts/aws-poc.ps1 up -WithHA. Plain up does not install this chart.
# The backup key and the EBS KMS key are passed at install time. Do not put tokens here.

replicaCount: 1

image:
  repository: ghcr.io/home-assistant/home-assistant
  tag: stable
  pullPolicy: IfNotPresent

# Pin matches a published amazon/aws-cli tag. The entrypoint is replaced with bash
# so the restore script can check size and KMS before it extracts.
restoreImage:
  repository: public.ecr.aws/aws-cli/aws-cli
  tag: "2.39.3"
  pullPolicy: IfNotPresent

bucket: grow-room-telemetry-590183769702
backupKey: ""
kmsKeyAlias: alias/grow-room/telemetry
region: us-west-2

persistence:
  size: 10Gi
  storageClassName: grow-room-ha-gp3
  ebsKmsKeyId: ""

service:
  port: 8123

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi
