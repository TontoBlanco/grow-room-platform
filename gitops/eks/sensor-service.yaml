# gitops/eks/sensor-service.yaml  (EKS-only; k3d keeps gitops/apps/)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sensor-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/TontoBlanco/grow-room-platform.git
    targetRevision: HEAD
    path: charts/sensor-service
    helm:
      valueFiles:
        - values.yaml
        - values-eks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: grow-room
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true