# gitops/eks/monitoring.yaml  - same as gitops/apps/monitoring.yaml plus values-eks.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.13.1
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/monitoring/values-k3d.yaml
          - $values/monitoring/values-eks.yaml
    - repoURL: https://github.com/TontoBlanco/grow-room-platform.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/TontoBlanco/grow-room-platform.git
      targetRevision: HEAD
      path: monitoring/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas