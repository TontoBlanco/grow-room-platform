name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/tontoblanco/grow-room-platform

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: lint sensor chart
        run: helm lint charts/sensor-service
      - name: lint and render kube-prometheus-stack values
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          tmp=$(mktemp -d)
          helm pull prometheus-community/kube-prometheus-stack --version 92.13.1 --untar --untardir "$tmp"
          helm lint "$tmp/kube-prometheus-stack" -n monitoring -f monitoring/values-k3d.yaml
          helm template monitoring "$tmp/kube-prometheus-stack" -n monitoring -f monitoring/values-k3d.yaml >/tmp/monitoring-rendered.yaml
          grep -q 'grafana-athena-datasource@3.4.2' /tmp/monitoring-rendered.yaml
          grep -q 'uid: athena-grow-room' /tmp/monitoring-rendered.yaml
          grep -q 'athena-rolesanywhere' /tmp/monitoring-rendered.yaml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,postgres]'
      - run: pytest --cov=sensor_service --cov-report=term-missing --cov-report=xml --cov-fail-under=80
        env:
          # Dedicated test database. The suite truncates nothing in public;
          # Postgres cases use the audit_test schema and drop it afterward.
          # Unset locally: those tests skip and the SQLite suite still runs.
          AUDIT_TEST_DATABASE_URL: postgresql://audit:audit@localhost:5432/audit
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # cosign keyless: get an OIDC token to prove "this workflow built it"
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # 1) build into the local Docker engine only
      - name: build (local, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          push: false
          tags: grow-room-platform:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) GATE: fail before anything reaches the registry
      - name: trivy image scan (HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: grow-room-platform:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # 3) push (cache makes this a re-tag, not a rebuild)
      - name: push
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # 4) SBOM of the pushed image
      - name: syft SBOM
        if: env.PUSH == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      # 5) sign the DIGEST (not a tag - tags can move) and attach the SBOM as a signed attestation.
      # Keyless: id-token: write on this job, Fulcio, public Rekor. Pin cosign 2.6
      # (not the installer's default 3.x). v2 writes the legacy sha256-<digest>.sig
      # tag. Cosign 3's referrer bundles are what Kyverno 1.19 verifyImages reported
      # as "no signatures found" for ghcr.io/tontoblanco/grow-room-platform:sha-*.
      # The certificate identity below must match k8s/aws-poc/kyverno-verify-images.yaml.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUSH == 'true'
        with:
          cosign-release: v2.6.5
      - name: cosign sign + attest (keyless)
        if: env.PUSH == 'true'
        env:
          REF: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --registry-referrers-mode=legacy "$REF"
          # attest defaults to the legacy .att tag in 2.6 (no --new-bundle-format).
          # It does not accept --registry-referrers-mode.
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
      - name: cosign verify (prove it in the log)
        if: env.PUSH == 'true'
        env:
          REF: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-identity "https://github.com/TontoBlanco/grow-room-platform/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > /dev/null
          echo "verified $REF" >> "$GITHUB_STEP_SUMMARY"
