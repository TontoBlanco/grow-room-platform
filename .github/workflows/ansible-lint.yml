name: ansible-lint
on:
  pull_request:
    paths: ["ansible/**"]
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - run: pipx install --include-deps ansible && pipx install ansible-lint
      # The runner's ansible-galaxy is the preinstalled ansible-core one. It
      # reports collections as already installed when they live outside
      # ~/.ansible/collections. ansible-lint below looks only at that path,
      # so install the pinned set there with --force.
      - run: ansible-galaxy collection install --force -p "$HOME/.ansible/collections" -r collections/requirements.yml
      - run: ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections ANSIBLE_CONFIG=$PWD/ansible.cfg ansible-playbook playbooks/site.yml --syntax-check
      - run: ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections ANSIBLE_CONFIG=$PWD/ansible.cfg ansible-playbook -i inventories/pi/hosts.yml playbooks/berry.yml --syntax-check
      - name: syntax-check from the repo root
        working-directory: ${{ github.workspace }}
        run: |
          ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections ANSIBLE_CONFIG="$PWD/ansible/ansible.cfg" ansible-playbook --syntax-check -i ansible/inventories/pi/hosts.yml ansible/playbooks/berry.yml
          ANSIBLE_CONFIG="$PWD/ansible.cfg" ansible-playbook --syntax-check -i ansible/inventories/local/hosts.yml ansible/playbooks/site.yml
      - run: ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections ansible-lint playbooks/site.yml playbooks/berry.yml
