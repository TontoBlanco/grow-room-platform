# .github/workflows/aws-poc-destroy.yml
name: aws-poc destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type destroy-grow-room-poc to confirm"
        required: true

permissions:
  contents: read

concurrency:
  group: aws-poc-terraform
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_my_ip_cidr: ${{ vars.MY_IP_CIDR }}
  TF_VAR_domain: ${{ vars.DOMAIN }}
  TF_VAR_admin_principal_arn: ${{ vars.ADMIN_PRINCIPAL_ARN }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  destroy:
    if: inputs.confirm == 'destroy-grow-room-poc'
    runs-on: ubuntu-latest
    environment: aws-poc
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/aws-poc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::590183769702:role/grow-room-gha-apply
          role-session-name: gha-destroy-${{ github.run_id }}
          aws-region: us-west-2
      - name: pre-check - Kubernetes-made AWS resources must already be gone
        run: |
          # CI cannot reach the EKS API (endpoint is limited to your home IP), so it cannot
          # delete the ALB, DNS records or Karpenter nodes. If they exist, terraform destroy
          # hangs on the VPC. Run: scripts/aws-poc.ps1 down -SkipTerraform  first.
          albs=$(aws elbv2 describe-load-balancers --query "length(LoadBalancers[?LoadBalancerName=='grow-room-poc'])" --output text)
          nodes=$(aws ec2 describe-instances --filters "Name=tag-key,Values=karpenter.sh/nodepool" "Name=instance-state-name,Values=pending,running" --query "length(Reservations[].Instances[])" --output text)
          recs=$(aws route53 list-resource-record-sets --hosted-zone-id Z10410981MCU751WUGL52 --query "length(ResourceRecordSets[?contains(Name, 'app.mygrowroom.click') && !starts_with(Name, '_')])" --output text)
          echo "ALBs=$albs karpenterNodes=$nodes appRecords=$recs"
          if [ "$albs" != "0" ] || [ "$nodes" != "0" ] || [ "$recs" != "0" ]; then
            echo "::error::Run scripts/aws-poc.ps1 down -SkipTerraform from your PC first"; exit 1
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform plan -destroy -input=false -lock-timeout=5m -no-color -out=destroy.tfplan
      - run: terraform apply -input=false -lock-timeout=5m -no-color destroy.tfplan