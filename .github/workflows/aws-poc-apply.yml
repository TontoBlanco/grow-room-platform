# .github/workflows/aws-poc-apply.yml
name: aws-poc apply

on:
  push:
    branches: [main]
    paths:
      - "infra/aws-poc/**"
  workflow_dispatch: {}      # "Run workflow" button = bring the stack up from CI

permissions:
  contents: read

concurrency:
  group: aws-poc-terraform
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_my_ip_cidr: ${{ vars.MY_IP_CIDR }}
  TF_VAR_domain: ${{ vars.DOMAIN }}
  TF_VAR_admin_principal_arn: ${{ vars.ADMIN_PRINCIPAL_ARN }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: aws-poc     # pauses for your approval AND makes the OIDC sub ...:environment:aws-poc
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/aws-poc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::590183769702:role/grow-room-gha-apply
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: us-west-2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform init -input=false
      - name: plan (fresh, against current state)
        run: |
          terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan | tee plan.log
          echo '### aws-poc apply plan' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^Plan:|No changes' plan.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: apply exactly that plan
        run: terraform apply -input=false -lock-timeout=5m -no-color tfplan