- name: Install sqlite3 for the online database backup
  ansible.builtin.apt:
    name: sqlite3
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the Home Assistant backup directory
  ansible.builtin.file:
    path: "{{ ha_backup_dest }}"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: Install the Home Assistant backup script
  ansible.builtin.copy:
    src: ha-backup
    dest: "{{ ha_backup_script_path }}"
    mode: "0755"
    owner: root
    group: root

- name: Install the Home Assistant backup environment file
  ansible.builtin.template:
    src: ha-backup.env.j2
    dest: "{{ ha_backup_env_path }}"
    mode: "0644"
    owner: root
    group: root

- name: Install the Home Assistant backup service
  ansible.builtin.template:
    src: ha-backup.service.j2
    dest: /etc/systemd/system/ha-backup.service
    mode: "0644"
    owner: root
    group: root

- name: Install the Home Assistant backup timer
  ansible.builtin.template:
    src: ha-backup.timer.j2
    dest: /etc/systemd/system/ha-backup.timer
    mode: "0644"
    owner: root
    group: root

- name: Enable the nightly Home Assistant backup timer
  ansible.builtin.systemd:
    name: ha-backup.timer
    enabled: true
    state: started
    daemon_reload: true
