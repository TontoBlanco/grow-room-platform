- name: Configure the Raspberry Pi edge host
  hosts: edge
  gather_facts: false
  become: true
  pre_tasks:
    - name: Check for Python 3
      ansible.builtin.raw: command -v python3
      register: berry_python3
      changed_when: false
      failed_when: false

    - name: Install Python 3 when the Pi has no interpreter
      ansible.builtin.raw: >-
        DEBIAN_FRONTEND=noninteractive apt-get update
        && DEBIAN_FRONTEND=noninteractive apt-get install -y python3
      when: berry_python3.rc != 0
      changed_when: true

    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - base
    - docker
    - homeassistant
    - ha_backup
