[defaults]
inventory = inventories/local/hosts.yml
# Two entries so the same file works from either directory.
# `roles` is next to this file. Newer Ansible resolves that against this
# file, which is what CI uses from ansible/. Older Ansible resolves it
# against the cwd, so the documented repo-root command also needs
# `ansible/roles`.
roles_path = roles:ansible/roles
stdout_callback = default
result_format = yaml
retry_files_enabled = False

[privilege_escalation]
become_exe = sudo.ws
