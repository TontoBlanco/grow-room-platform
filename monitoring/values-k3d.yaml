# kube-prometheus-stack values tuned for a small k3d lab ($0).
# Used by gitops/apps/monitoring.yaml (Argo multi-source Helm + this file).
#
# Goals:
# - Fit in laptop RAM (disable noisy control-plane scrapes k3d does not expose)
# - Discover ServiceMonitors / PrometheusRules cluster-wide (not only Helm-owned ones)
# - Keep Alertmanager + Grafana so you can fire a test alert and open a VPD board

fullnameOverride: monitoring

# Default kube-* rules assume cloud control-plane endpoints. k3d hides most of them.
defaultRules:
  create: true
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

grafana:
  enabled: true
  adminPassword: grow-room-lab  # lab only; change if you expose beyond localhost
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
  # Amazon Athena for the Grow-room History board. authType default uses the
  # AWS SDK default chain inside grafana-athena-datasource. Grafana 13 starts
  # that plugin without the host environment, then copies
  # AWS_CONTAINER_CREDENTIALS_FULL_URI because the plugin id is in
  # [aws] forward_settings_to_plugins. The sidecar serves that ECS credential
  # document from the Roles Anywhere cert (secret grafana-athena-identity,
  # not in git). Without that secret the sidecar sleeps and this pod still
  # starts. Docs: docs/ATHENA_GRAFANA.md
  plugins:
    - grafana-athena-datasource@3.4.2
  env:
    AWS_REGION: us-west-2
    AWS_DEFAULT_REGION: us-west-2
    # Full URI, loopback host, no trailing slash. Grafana forwards this name
    # to grafana-athena-datasource. The SDK selects it before EC2 IMDS.
    AWS_CONTAINER_CREDENTIALS_FULL_URI: http://127.0.0.1:9911/credentials
    # The credential GET uses the default HTTP client, which honors the proxy
    # env. These two are on Grafana's permitted plugin env list.
    NO_PROXY: 127.0.0.1,localhost
    no_proxy: 127.0.0.1,localhost
  grafana.ini:
    aws:
      # Default chain only, so a pasted access key in the UI is not a second auth path.
      allowed_auth_providers: default
      # Pin the plugin that receives AWS_CONTAINER_CREDENTIALS_FULL_URI.
      forward_settings_to_plugins: grafana-athena-datasource
  additionalDataSources:
    - name: Amazon Athena
      uid: athena-grow-room
      type: grafana-athena-datasource
      access: proxy
      isDefault: false
      editable: true
      orgId: 1
      jsonData:
        authType: default
        defaultRegion: us-west-2
        catalog: AwsDataCatalog
        database: grow_room_telemetry
        workgroup: grow-room-telemetry
  # aws_signing_helper 1.8.5 is the Amzn2023 glibc binary. It runs in the
  # amazonlinux sidecar, which is the only container that mounts the cert.
  # sha256 is checked before the sidecar execs the file.
  extraInitContainers:
    - name: fetch-aws-signing-helper
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      imagePullPolicy: IfNotPresent
      env:
        - name: HOME
          value: /tmp
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              sha=beec9ed1c492d93db809890f16713e3556353294b823c2184ad4e891f1b2b54d
              arch=X86_64
              ;;
            aarch64|arm64)
              sha=3d131aa888cd56da446f9c6bb460b1f0569f6c7edc74eae6193a2fe3928883ba
              arch=Aarch64
              ;;
            *)
              echo "unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o /opt/rolesanywhere/aws_signing_helper \
            "https://rolesanywhere.amazonaws.com/releases/1.8.5/${arch}/Linux/Amzn2023/aws_signing_helper"
          echo "${sha}  /opt/rolesanywhere/aws_signing_helper" | sha256sum -c -
          chmod 0755 /opt/rolesanywhere/aws_signing_helper
          /opt/rolesanywhere/aws_signing_helper version
      volumeMounts:
        - name: aws-signing-helper
          mountPath: /opt/rolesanywhere
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 256Mi
  extraContainers:
    - name: athena-rolesanywhere
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      imagePullPolicy: IfNotPresent
      env:
        - name: HOME
          value: /tmp
        - name: AWS_REGION
          value: us-west-2
        - name: PYTHONUNBUFFERED
          value: "1"
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          if [ ! -s /etc/grafana-athena/tls.crt ] || [ ! -s /etc/grafana-athena/tls.key ]; then
            echo "grafana-athena-identity is not mounted; Athena will not authenticate until that secret exists"
            exec sleep infinity
          fi
          exec python3 - << 'ATHENA_CONTAINER_CREDENTIALS_PY'
          import json
          import os
          import subprocess
          import sys
          import threading
          from datetime import datetime, timedelta, timezone
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          HELPER = os.environ.get("AWS_SIGNING_HELPER", "/opt/rolesanywhere/aws_signing_helper")
          IDENTITY = os.environ.get("GRAFANA_ATHENA_IDENTITY", "/etc/grafana-athena")
          PORT = int(os.environ.get("ATHENA_CREDENTIAL_PORT", "9911"))
          REFRESH_SKEW = timedelta(minutes=5)
          ThreadingHTTPServer.allow_reuse_address = True


          def read_arn(name):
              path = os.path.join(IDENTITY, name)
              with open(path, encoding="utf-8") as handle:
                  return "".join(handle.read().split())


          def parse_expiration(value):
              # Python 3.9 on Amazon Linux 2023 accepts datetime.isoformat()
              # and rejects a trailing Z or a 3-digit fraction.
              text = value.strip()
              if text.endswith("Z"):
                  text = text[:-1] + "+00:00"
              if "." in text:
                  head, tail = text.split(".", 1)
                  tz = ""
                  for sign in ("+", "-"):
                      if sign in tail:
                          _, offset = tail.split(sign, 1)
                          tz = sign + offset
                          break
                  text = head + tz
              parsed = datetime.fromisoformat(text)
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=timezone.utc)
              return parsed


          def to_container_credentials(payload):
              required = ("AccessKeyId", "SecretAccessKey", "SessionToken", "Expiration")
              missing = [key for key in required if not payload.get(key)]
              if missing:
                  raise ValueError("credential-process response missing " + ",".join(missing))
              parse_expiration(payload["Expiration"])
              return {
                  "AccessKeyID": payload["AccessKeyId"],
                  "SecretAccessKey": payload["SecretAccessKey"],
                  "Token": payload["SessionToken"],
                  "Expiration": payload["Expiration"],
              }


          def fetch_credentials():
              command = [
                  HELPER,
                  "credential-process",
                  "--certificate",
                  os.path.join(IDENTITY, "tls.crt"),
                  "--private-key",
                  os.path.join(IDENTITY, "tls.key"),
                  "--trust-anchor-arn",
                  read_arn("trust-anchor-arn"),
                  "--profile-arn",
                  read_arn("profile-arn"),
                  "--role-arn",
                  read_arn("role-arn"),
                  "--region",
                  os.environ.get("AWS_REGION", "us-west-2"),
              ]
              completed = subprocess.run(command, capture_output=True, text=True, check=False)
              if completed.returncode != 0:
                  lines = (completed.stderr or "credential-process failed").strip().splitlines()
                  detail = lines[-1][:300] if lines else "credential-process failed"
                  raise RuntimeError(detail)
              try:
                  payload = json.loads(completed.stdout)
              except json.JSONDecodeError:
                  raise RuntimeError("credential-process did not return JSON") from None
              return to_container_credentials(payload)


          class _Cache:
              def __init__(self):
                  self._lock = threading.Lock()
                  self._body = None
                  self._refresh_by = None

              def get(self):
                  with self._lock:
                      now = datetime.now(timezone.utc)
                      if self._body is not None and self._refresh_by is not None and now < self._refresh_by:
                          return self._body
                      body = fetch_credentials()
                      self._body = body
                      self._refresh_by = parse_expiration(body["Expiration"]) - REFRESH_SKEW
                      return body


          CACHE = _Cache()


          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def do_GET(self):
                  path = self.path.split("?", 1)[0]
                  if path != "/credentials":
                      self._json(404, {"code": "NotFound", "message": "not found"})
                      return
                  try:
                      body = CACHE.get()
                  except Exception as exc:
                      self._json(500, {"code": "CredentialProcessFailed", "message": str(exc)})
                      return
                  self._json(200, body)

              def _json(self, status, payload):
                  raw = json.dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(raw)))
                  self.end_headers()
                  self.wfile.write(raw)

              def log_message(self, fmt, *args):
                  sys.stderr.write("athena-credentials " + (fmt % args) + "\n")


          def main():
              server = ThreadingHTTPServer(("127.0.0.1", PORT), Handler)
              host, port = server.server_address
              print("container credentials listening on http://%s:%s/credentials" % (host, port), flush=True)
              server.serve_forever()


          if __name__ == "__main__":
              main()
          ATHENA_CONTAINER_CREDENTIALS_PY
      volumeMounts:
        - name: aws-signing-helper
          mountPath: /opt/rolesanywhere
          readOnly: true
        - name: grafana-athena-identity
          mountPath: /etc/grafana-athena
          readOnly: true
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 256Mi
  extraContainerVolumes:
    - name: aws-signing-helper
      emptyDir: {}
    - name: grafana-athena-identity
      secret:
        secretName: grafana-athena-identity
        optional: true
        defaultMode: 0440
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    type: ClusterIP

# Operator + Prometheus are the heavy bits — keep retention and resources tiny.
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 24h
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Pick up ServiceMonitors / PodMonitors / PrometheusRules from any namespace,
    # including grow-room (sensor ServiceMonitor) and monitoring (grow-room rules).
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
    storageSpec: {}  # emptyDir via default; fine for disposable k3d
    # Static scrape of the Docker Compose sensor-service on the host
    # (SENSOR_SOURCE=homeassistant, published on port 8000). The in-cluster
    # chart stays on the simulator and does not export grow_probe_* /
    # grow_controller_* / grow_port_*, so Grafana's "No HA sample" panels
    # stay empty until this job is UP.
    #
    # host.k3d.internal is the k3d name for the Docker host. Since k3d
    # v3.1.0 it is injected into the k3s node /etc/hosts and into CoreDNS
    # (NodeHosts / coredns-custom), so pods — including Prometheus — resolve
    # it to the k3d network gateway:
    #   https://k3d.io/v5.9.0/faq/faq/  (host services from inside the cluster)
    #   https://k3d.io/stable/usage/k3s/ (CoreDNS in k3d)
    # scripts/bootstrap-k3d.sh does not disable that injection.
    #
    # If the target stays DOWN, change the single target below (do not add a
    # second `prometheus:` key — YAML would drop this block):
    # - host.docker.internal:8000 — Docker Desktop's host alias. k3d does not
    #   put it in CoreDNS. Use it only after `nslookup host.docker.internal`
    #   succeeds inside the Prometheus pod. On Docker Desktop it can reach a
    #   port published on 127.0.0.1; host.k3d.internal cannot, because that
    #   name is the bridge gateway, not loopback.
    # - <gateway>:8000 — same address host.k3d.internal should resolve to,
    #   when DNS itself is broken. `docker network inspect k3d-grow-room-dev`
    #   IPAM Gateway, or the A record in the kube-system coredns ConfigMap.
    # Compose must publish `8000:8000` (all interfaces). `127.0.0.1:8000:8000`
    # is reachable from the host curl, and not from the k3d gateway.
    #
    # job=grow-room-ha-host, instance=docker-compose-sensor-service, and
    # sensor_source=homeassistant keep these series off the in-cluster
    # ServiceMonitor (job usually sensor-service, instance = pod IP).
    # No tokens in this file. HA_TOKEN stays in the gitignored .env.
    additionalScrapeConfigs:
      - job_name: grow-room-ha-host
        metrics_path: /metrics
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets:
              - host.k3d.internal:8000
            labels:
              instance: docker-compose-sensor-service
              sensor_source: homeassistant

# k3d often cannot scrape these securely / they do not exist — turn off to cut noise.
kubeApiServer:
  enabled: true
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubelet:
  enabled: true

# node-exporter + kube-state-metrics are useful and usually fine on k3d.
nodeExporter:
  enabled: true
kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Annotation-based pod discovery is not enabled. kube-prometheus-stack scrapes
# ServiceMonitors (monitoring/manifests/sensor-servicemonitor.yaml) plus the
# static grow-room-ha-host job under prometheus.prometheusSpec above.
# A second top-level `prometheus:` key in this file overrides the real spec.
