# monitoring/values-eks.yaml  - layered ON TOP of values-k3d.yaml, EKS only
alertmanager:
  serviceAccount:
    create: true
    name: alertmanager          # matches the Pod Identity association
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: sns-email
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: sns-email
        sns_configs:
          - topic_arn: arn:aws:sns:us-west-2:590183769702:grow-room-poc-alerts
            sigv4:
              region: us-west-2
            subject: '[grow-room] {{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
            message: |-
              {{ range .Alerts }}{{ .Labels.severity }}: {{ .Annotations.summary }}
              {{ .Annotations.description }}
              started {{ .StartsAt }}
              {{ end }}
            send_resolved: true

# Layered on top of monitoring/values-k3d.yaml. Helm replaces lists, so this
# empty list drops the grow-room-ha-host scrape (host.k3d.internal:8000, Home
# Assistant on the lab PC). EKS cannot route that address, the target stays
# down, and kube-prometheus fires TargetDown. The k3d Application does not
# load this file, so the local job stays.
prometheus:
  prometheusSpec:
    additionalScrapeConfigs: []