# Grafana sidecar picks ConfigMaps labeled grafana_dashboard=1 (see values-k3d.yaml).
# Analogy: this ConfigMap is to Grafana what a ConfigMap volume mount is to a Pod —
# the sidecar watches the API and "mounts" dashboards into Grafana's provisioning dir.
# Keep this document identical to monitoring/dashboards/grow-room-vpd.json
# (tests/test_grafana_dashboard.py checks that).
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: grafana-dashboard-grow-room-vpd
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: grow-room-platform
data:
  grow-room-vpd.json: |
