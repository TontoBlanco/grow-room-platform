      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "stat",
          "title": "Scrape up",
          "id": 1,
          "gridPos": {
            "h": 4,
            "w": 9,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "One tile per live scrape job. max by (job) drops pod and instance labels, so a rolled sensor-service target does not stay on the board as its own DOWN tile.",
