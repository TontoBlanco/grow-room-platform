  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: grafana-dashboard-grow-room-vpd
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: grow-room-platform
