            "mode": "markdown",
            "content": "Controller air temperature and humidity are the original gauges (`grow_temperature_celsius`, `grow_humidity_percent`). Computed leaf VPD stays `grow_vpd_kpa` on the top row. `grow_controller_vpd_kpa` is the controller's own VPD, converted to kPa. `grow_controller_status` is 1 when that binary sensor is on and 0 when it is off.\n\nProbe canopy is `grow_probe_temperature_celsius`, `grow_probe_humidity_percent`, and `grow_probe_vpd_kpa`.\n\nEach active UIS device is a `device` label on `grow_port_current_power` (the level the UIS device reports) and `grow_port_status` (1 on, 0 off).\n\nThese gauges are created on the first Home Assistant sample. The simulator does not export them, so empty panels are expected until Prometheus scrapes `SENSOR_SOURCE=homeassistant`.\n\nPanels in this section select `sensor_source=\"homeassistant\"` (the `grow-room-ha-host` scrape) and aggregate with `max by` so each chart has one series per line. In-cluster simulator pods keep their own `instance` and `pod` labels and stay off these legends."
