# Loaded when a playbook is started from the repo root with no ANSIBLE_CONFIG.
# ansible/ansible.cfg is the copy used from that directory and by the berry
# commands, which set ANSIBLE_CONFIG.
[defaults]
inventory = ansible/inventories/local/hosts.yml
roles_path = ansible/roles
stdout_callback = default
result_format = yaml
retry_files_enabled = False

[privilege_escalation]
become_exe = sudo.ws
