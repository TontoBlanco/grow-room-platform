site_name: Grow room platform
site_description: How the indoor grow-tent monitor is built, from the controller to Grafana, and how to rebuild it.
site_url: https://tontoblanco.github.io/grow-room-platform/
repo_url: https://github.com/TontoBlanco/grow-room-platform
repo_name: TontoBlanco/grow-room-platform
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: green
      accent: teal

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Grafana guide: grafana.md
  - Athena in Grafana: ATHENA_GRAFANA.md
  - Grow alerts: GROW_ALERTS.md
  - Phases:
      - Week 1 — Application and CI: phases/week-1-application-and-ci.md
      - Week 2 — Terraform for the local lab: phases/week-2-terraform.md
      - Week 3 — Kubernetes and GitOps: phases/week-3-gitops.md
      - Week 4 — Observability and the live tent: phases/week-4-observability.md
      - Week 5 — Audit history: phases/week-5-audit.md
      - AWS proof of concept: phases/aws-proof-of-concept.md
      - Phase 1 — GitHub Actions OIDC: phases/phase-1-oidc.md
      - Phase 2 — Up, verify, and down: phases/phase-2-up-verify-down.md
      - Phase 3 — Readings in S3 and Athena: phases/phase-3-telemetry.md
      - Phase 4 — SLOs, alerts, and drills: phases/phase-4-slos-and-drills.md
      - Phase 5 — Signing, SBOM, and the scan gate: phases/phase-5-supply-chain.md
      - Phase 6 — Costs and decision records: phases/phase-6-costs-and-adrs.md
      - Phase 7 — Ansible on WSL2: phases/phase-7-ansible.md
      - Phase 8 — Home Assistant move: aws-poc/PHASE8_HA_MIGRATION.md
  - Project management:
      - Decisions: project-management/decisions.md
      - Risk log: project-management/risk-log.md
      - Roadmap: project-management/roadmap.md
      - GitHub Project setup: project-management/github-project-setup.md
  - Security:
      - Threat model: security/threat-model.md
      - IAM and secrets: security/iam-and-secrets.md
      - Controls: security/controls.md
  - Test session, 3 November 2026: test-session/2026-11-03.md
  - Troubleshooting: troubleshooting.md
  - Weekly guides:
      - Index: weekly-guides/index.md
      - Week 1 CI guide: weekly-guides/WEEK1_CI_GUIDE.md
      - Week 2 CI note: weekly-guides/WEEK2_CI_NOTE.md
      - Week 2 Terraform guide: weekly-guides/WEEK2_TERRAFORM_GUIDE.md
      - Week 3 CI note: weekly-guides/WEEK3_CI_NOTE.md
      - Week 3 GitOps guide: weekly-guides/WEEK3_GITOPS_GUIDE.md
      - Week 4 CI note: weekly-guides/WEEK4_CI_NOTE.md
      - Week 4 observability guide: weekly-guides/WEEK4_OBSERVABILITY_GUIDE.md
      - Week 5 CI note: weekly-guides/WEEK5_CI_NOTE.md
      - Week 5 audit guide: weekly-guides/WEEK5_AUDIT_LOG_GUIDE.md
      - Week 5 compliance notes: weekly-guides/WEEK5_COMPLIANCE_NOTES.md
      - Week 5 write-up outline: weekly-guides/WEEK5_WRITEUP_OUTLINE.md
  - Decision records:
      - Template: adr/0000-template.md
      - ADR-0001 NAT gateway per AZ: adr/0001-nat-gateway-per-az.md
      - ADR-0002 Karpenter: adr/0002-karpenter-for-node-scaling.md
      - ADR-0003 EKS Pod Identity: adr/0003-eks-pod-identity.md
      - ADR-0004 External Secrets: adr/0004-external-secrets-operator.md
      - ADR-0005 WAF on the load balancer: adr/0005-aws-waf-on-alb.md
      - ADR-0006 RDS Multi-AZ: adr/0006-rds-multi-az.md
      - ADR-0007 SQLite and Postgres: adr/0007-sqlite-and-postgres.md
      - ADR-0008 OIDC for Terraform CI: adr/0008-oidc-for-terraform-ci.md
      - ADR-0009 Roles Anywhere shipper: adr/0009-roles-anywhere-shipper.md
      - ADR-0010 S3 and Athena: adr/0010-s3-and-athena.md
      - ADR-0011 k3d instead of a Pi: adr/0011-k3d-instead-of-a-pi.md
  - Build notes:
      - Capstone write-up: CAPSTONE.md
      - Audit router patch note: main_patch.md
      - AWS proof-of-concept gallery: aws-poc/README.md
      - AWS cost record: aws-poc/COSTS.md
      - Failure drills: aws-poc/DRILLS.md
