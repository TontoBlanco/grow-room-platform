# k8s/aws-poc/kyverno-verify-images.yaml  (OPTIONAL - stack up only)
# Enforce was validated on 18 November 2026 after an Audit pass.
# PolicyReports were pass=1 fail=0 for the sensor-service pods, ReplicaSets,
# and Deployment on ghcr.io/tontoblanco/grow-room-platform:sha-c8985e5.
# The record is docs/test-session/2026-11-18.md.
#
# Install chart 3.9.2 (Kyverno v1.19.2). Chart 3.10.0 is Kyverno v1.20.0,
# where ClusterPolicy verifyImages is slated for removal, so pin 3.9.2:
#   helm repo add kyverno https://kyverno.github.io/kyverno/
#   helm upgrade --install kyverno kyverno/kyverno -n kyverno --create-namespace --version 3.9.2 --wait
#
# failureAction, mutateDigest, and verifyDigest are set together.
# Kyverno rejects mutateDigest: true while the failure action is Audit
# ("mutateDigest must be set to false for Audit failure action").
#
# ClusterPolicy verifyImages is deprecated in Kyverno 1.19 in favor of
# ImageValidatingPolicy (policies.kyverno.io/v1). Removal is planned for 1.20.
# Migrating this rule is a later task; this file stays a ClusterPolicy so the
# PoC install steps do not change.
# https://kyverno.io/docs/guides/migration-to-cel/
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-grow-room-images
spec:
  webhookTimeoutSeconds: 30
  rules:
    - name: signed-by-ci-on-main
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["grow-room"]
      verifyImages:
        - imageReferences:
            - "ghcr.io/tontoblanco/grow-room-platform*"
          failureAction: Enforce
          mutateDigest: true
          verifyDigest: true
          attestors:
            - entries:
                - keyless:
                    # Same identity string ci.yml passes to `cosign verify`.
                    subject: "https://github.com/TontoBlanco/grow-room-platform/.github/workflows/ci.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
